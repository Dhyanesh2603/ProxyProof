version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proxyproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proxyproof}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proxyproof-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: proxyproof-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-proxyproof}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-proxyproof-super-secure-production-master-secret-key-2026}
      ROTATING_TOKEN_INTERVAL_SECONDS: 5
      DEFAULT_RSSI_THRESHOLD: -75
    ports:
      - "8000:8000"

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: proxyproof-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  pgdata:
  redisdata:
